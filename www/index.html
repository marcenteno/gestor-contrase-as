<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de contraseñas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <main class="app">

    <header class="header">
      <h1>Pass saver</h1>
      <div class="window-buttons">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </header>

    <nav class="toolbar">
      <button type="button" class="active-button">
        Add categorie
      </button>
      <button type="button" id="add-site-button">
        Add site
      </button>
    </nav>

    <div class="site-form-container" id="site-form-container" style="display: none;">
      <h3>Añadir sitio a la categoría seleccionada</h3>

      <form id="site-form">
        <input
          type="text"
          id="site-name"
          placeholder="Nombre del sitio"
          required
        >

        <input
          type="text"
          id="site-user"
          placeholder="Usuario"
          required
        >

        <input
          type="password"
          id="site-password"
          placeholder="Contraseña"
          required
        >

        <button type="submit">Guardar sitio</button>
      </form>
    </div>

    <div class="container">

      <aside class="sidebar">
        <h2>Categories</h2>

        <div class="category-form-container">
          <h3>Añadir categoría</h3>

          <form id="category-form">
            <input
              type="text"
              id="category-name"
              placeholder="Nombre de la categoría"
              required
            >
            <button type="submit">Añadir</button>
          </form>
        </div>

        <ul id="category-list"></ul>
      </aside>

      <section class="content">
        <h2 id="selected-category"></h2>

        <table>
          <thead>
            <tr>
              <th>Sitio</th>
              <th>User</th>
              <th>Created at</th>
              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="sites-table"></tbody>
        </table>
      </section>

    </div>

  </main>

  <script src="js/index.js"></script>
</body>
</html>
